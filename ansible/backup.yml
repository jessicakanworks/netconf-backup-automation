---
- name: Backup Cisco IOS/IOS-XE configs
  hosts: cisco
  gather_facts: false
  connection: network_cli
  tasks:
    - cisco.ios.ios_config:
        backup: true
        backup_options: {dir_path: ../backups, filename: "{{ inventory_hostname }}.cfg"}

- name: Backup Junos configs
  hosts: junos
  gather_facts: false
  connection: netconf
  tasks:
    - junipernetworks.junos.junos_config:
        backup: true
        backup_options: {dir_path: ../backups, filename: "{{ inventory_hostname }}.cfg"}
